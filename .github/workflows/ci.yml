name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            ./BTCPayServer.Plugins.Indra/packages.lock.json
            ./BTCPayServer.Plugins.Indra.Tests/BTCPayServer.Plugins.Indra.Tests.csproj

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore dependencies
        run: dotnet restore BTCPayServer.Plugins.Indra --locked-mode

      - name: Build plugin
        run: dotnet build BTCPayServer.Plugins.Indra --configuration Release --no-restore

      - name: Build test project for Playwright
        run: dotnet build BTCPayServer.Plugins.Indra.Tests --configuration Debug -m:1

      - name: Install Playwright Chromium
        run: node ./BTCPayServer.Plugins.Indra.Tests/bin/Debug/net10.0/.playwright/package/cli.js install chromium

      - name: Install Playwright Linux dependencies
        run: sudo env PATH="$PATH" node ./BTCPayServer.Plugins.Indra.Tests/bin/Debug/net10.0/.playwright/package/cli.js install-deps chromium

      - name: Install Node.js dependencies
        working-directory: ./docs
        run: npm ci

      - name: Prettier docs
        working-directory: ./docs
        run: npm run prettier:check

      - name: Build docs
        working-directory: ./docs
        run: npm run docs:build

      - name: Setup Indra regtest
        env:
          COMPOSE_FILE: docker-compose.yml:../docker-compose.plugin-regtest.yml
          COMPOSE_PROFILES: ci
        run: |
          ./regtest-config/prepare.sh
          cd regtest
          ./start.sh

      - name: Run tests
        run: make test
